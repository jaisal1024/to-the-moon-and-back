name: CI

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Test Google Analytics ID
  NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: 'G-KL7CLHPFFB'
  # Payload CMS runs against a throwaway postgres:18 service container per job; CI never touches Neon.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/to_the_moon
  PAYLOAD_SECRET: ci-only-payload-secret

jobs:
  title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          validateSingleCommit: 'false'
          validateSingleCommitMatchesPrTitle: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-config:
    name: Validate release configuration
    uses: ./.github/workflows/validate-release.yml

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: to_the_moon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d to_the_moon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm run build
      - run: pnpm run check

  test-e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # The image ships the browsers and their system libraries, so the job never
    # waits on apt mirrors. Keep the tag in sync with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    # Inside a job container, service containers are reached by name, not localhost.
    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/to_the_moon
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: to_the_moon
        options: >-
          --health-cmd "pg_isready -U postgres -d to_the_moon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Payload migrations
        run: pnpm run migrate
      - name: Seed sample content
        run: pnpm run seed
      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      # Playwright builds and serves the app itself (see webServer in playwright.config.ts).
      - name: Run Playwright tests
        run: pnpm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 15
  gate:
    name: CI - gate
    if: always()
    needs: [title, release-config, build, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          TITLE_RESULT: ${{ needs.title.result }}
          RELEASE_CONFIG_RESULT: ${{ needs.release-config.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.test-e2e.result }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$TITLE_RESULT" = success
          else
            test "$TITLE_RESULT" = skipped
          fi
          test "$RELEASE_CONFIG_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$E2E_RESULT" = success
