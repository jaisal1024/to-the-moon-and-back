name: Validate release configuration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate release-please configuration against its schema
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/googleapis/release-please/v17.11.2/schemas/config.json \
            --output "$RUNNER_TEMP/release-please-schema.json"
          npx --yes --package=ajv-cli@5.0.0 ajv validate --strict=false \
            -s "$RUNNER_TEMP/release-please-schema.json" -d release-please-config.json
      - name: Check release version consistency
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          manifest = json.loads(Path('.release-please-manifest.json').read_text())
          version = Path('version.txt').read_text().strip()
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version), 'Expected MAJOR.MINOR.PATCH'
          assert manifest == {'.': version}, 'Manifest and version.txt must match'
          PY
